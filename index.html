<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#f6f8fa" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
  <title>Payment</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />

  <!-- static-host config (used only when no verification server is present) -->
  <script src="config.js"></script>
  <script src="https://js.paystack.co/v2/inline.js"></script>
</head>

<body>

  <header class="bar">
    <div class="bar-inner">
      <span class="bar-title">Payment</span>
      <span class="bar-lock"><i class="fas fa-lock"></i> Secure</span>
    </div>
  </header>

  <main class="main">

    <!-- ── FORM ───────────────────────────────────────────────── -->
    <form class="card" id="paymentForm" novalidate autocomplete="on">

      <div class="group">
        <label class="label" for="amountInput">Amount</label>
        <div class="amount-row">
          <div class="amount" id="amountWrap">
            <span class="amount-prefix" id="amountPrefix">₦</span>
            <input
              type="text"
              id="amountInput"
              name="amount"
              class="amount-input"
              inputmode="decimal"
              placeholder="0.00"
              autocomplete="off"
              aria-label="Amount"
              required
            />
          </div>
          <div class="cur" role="group" aria-label="Currency">
            <button type="button" class="cur-btn is-active" data-currency="NGN" aria-pressed="true">₦</button>
            <button type="button" class="cur-btn" data-currency="USD" aria-pressed="false">$</button>
          </div>
        </div>
        <p class="hint" id="amountError" role="alert"></p>
      </div>

      <div class="group">
        <label class="label" for="buyerEmail">Email</label>
        <input
          type="email"
          id="buyerEmail"
          name="email"
          class="input"
          inputmode="email"
          autocomplete="email"
          placeholder="name@company.com"
          aria-label="Email"
          required
        />
        <p class="hint" id="emailError" role="alert"></p>
      </div>

      <button type="submit" class="pay" id="payBtn" disabled>
        <span class="pay-label" id="payBtnText">Pay</span>
        <span class="pay-load" id="payBtnLoader" hidden><span class="spin"></span></span>
      </button>

      <details class="more" id="moreDetails">
        <summary>Add details</summary>
        <div class="more-body">
          <div class="group">
            <label class="label" for="buyerName">Name</label>
            <input type="text" id="buyerName" name="name" class="input" autocomplete="name" placeholder="Full name" />
          </div>
          <div class="group">
            <label class="label" for="githubHandle">GitHub handle</label>
            <input type="text" id="githubHandle" name="github" class="input" autocomplete="off" spellcheck="false" placeholder="@handle" />
          </div>
          <div class="group">
            <label class="label" for="workReference">PR or issue</label>
            <input type="text" id="workReference" name="reference" class="input" autocomplete="off" spellcheck="false" placeholder="owner/repo#000" />
          </div>
          <div class="group">
            <label class="label" for="paymentNote">Note</label>
            <input type="text" id="paymentNote" name="note" class="input" autocomplete="off" placeholder="Optional" />
          </div>
        </div>
      </details>

      <p class="foot"><i class="fas fa-lock"></i> Paystack</p>
    </form>

    <!-- ── PROCESSING ─────────────────────────────────────────── -->
    <div class="card panel" id="processingState" hidden>
      <span class="spin spin-lg"></span>
      <p class="panel-title" id="processingText">Confirming payment</p>
    </div>

    <!-- ── SUCCESS ────────────────────────────────────────────── -->
    <div class="card panel" id="successState" hidden>
      <span class="mark ok"><i class="fas fa-check"></i></span>
      <p class="panel-title">Payment successful</p>
      <p class="panel-amount mono" id="successAmount"></p>
      <dl class="meta">
        <div><dt>Reference</dt><dd class="mono" id="successRef"></dd></div>
      </dl>
      <div class="panel-actions">
        <button type="button" class="btn" id="copyRefBtn">Copy reference</button>
        <button type="button" class="btn btn-quiet" id="doneBtn">Done</button>
      </div>
    </div>

    <!-- ── FAILED ─────────────────────────────────────────────── -->
    <div class="card panel" id="failedState" hidden>
      <span class="mark bad"><i class="fas fa-xmark"></i></span>
      <p class="panel-title" id="failedTitle">Payment failed</p>
      <p class="panel-text" id="failedText"></p>
      <div class="panel-actions">
        <button type="button" class="btn btn-primary" id="retryBtn">Try again</button>
      </div>
    </div>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
