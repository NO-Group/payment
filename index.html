<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#f6f8fa" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
  <title>Payment</title>

  <link rel="stylesheet" href="css/style.css" />

  <!-- static-host config (used only when no verification server is present) -->
  <script src="config.js"></script>
  <script src="https://js.paystack.co/v2/inline.js" defer></script>
</head>

<body>

  <header class="bar">
    <div class="bar-inner">
      <span class="bar-title">Payment</span>
      <span class="bar-lock"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1a3.5 3.5 0 0 0-3.5 3.5V6H4a1.5 1.5 0 0 0-1.5 1.5v5A1.5 1.5 0 0 0 4 14h8a1.5 1.5 0 0 0 1.5-1.5v-5A1.5 1.5 0 0 0 12 6h-.5V4.5A3.5 3.5 0 0 0 8 1Zm2 5H6V4.5a2 2 0 1 1 4 0V6Z"/></svg> Secure</span>
    </div>
  </header>

  <main class="main">

    <!-- ── FORM ───────────────────────────────────────────────── -->
    <form class="card" id="paymentForm" novalidate autocomplete="on">

      <div class="group">
        <label class="label" for="amountInput">Amount</label>
        <div class="amount-row">
          <div class="amount" id="amountWrap">
            <span class="amount-prefix" id="amountPrefix">₦</span>
            <input
              type="text"
              id="amountInput"
              name="amount"
              class="amount-input"
              inputmode="decimal"
              enterkeyhint="next"
              placeholder="0.00"
              autocomplete="off"
              aria-label="Amount"
              required
            />
          </div>
          <div class="cur" role="group" aria-label="Currency">
            <button type="button" class="cur-btn is-active" data-currency="NGN" aria-pressed="true">₦</button>
            <button type="button" class="cur-btn" data-currency="USD" aria-pressed="false">$</button>
          </div>
        </div>
        <p class="hint" id="amountError" role="alert"></p>
      </div>

      <div class="group">
        <label class="label" for="buyerEmail">Email</label>
        <input
          type="email"
          id="buyerEmail"
          name="email"
          class="input"
          inputmode="email"
          enterkeyhint="go"
          autocapitalize="off"
          autocomplete="email"
          placeholder="name@company.com"
          aria-label="Email"
          required
        />
        <p class="hint" id="emailError" role="alert"></p>
      </div>

      <button type="submit" class="pay" id="payBtn" aria-live="polite" disabled>
        <span class="pay-label" id="payBtnText">Pay</span>
        <span class="pay-load" id="payBtnLoader" hidden><span class="spin"></span></span>
      </button>

      <details class="more" id="moreDetails">
        <summary>Details</summary>
        <div class="more-body">
          <div class="group">
            <label class="label" for="buyerName">Name</label>
            <input type="text" id="buyerName" name="name" class="input" autocomplete="name" placeholder="Full name" />
          </div>
          <div class="group">
            <label class="label" for="githubHandle">GitHub handle</label>
            <input type="text" id="githubHandle" name="github" class="input" autocomplete="off" spellcheck="false" placeholder="@handle" />
          </div>
          <div class="group">
            <label class="label" for="workReference">PR or issue</label>
            <input type="text" id="workReference" name="reference" class="input" autocomplete="off" spellcheck="false" placeholder="owner/repo#000" />
          </div>
          <div class="group">
            <label class="label" for="paymentNote">Note</label>
            <input type="text" id="paymentNote" name="note" class="input" autocomplete="off" placeholder="Optional" />
          </div>
        </div>
      </details>

      <p class="foot"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1a3.5 3.5 0 0 0-3.5 3.5V6H4a1.5 1.5 0 0 0-1.5 1.5v5A1.5 1.5 0 0 0 4 14h8a1.5 1.5 0 0 0 1.5-1.5v-5A1.5 1.5 0 0 0 12 6h-.5V4.5A3.5 3.5 0 0 0 8 1Zm2 5H6V4.5a2 2 0 1 1 4 0V6Z"/></svg> Paystack</p>
    </form>

    <!-- ── PROCESSING ─────────────────────────────────────────── -->
    <div class="card panel" id="processingState" role="status" aria-live="polite" hidden>
      <span class="spin spin-lg"></span>
      <p class="panel-title" id="processingText">Confirming payment</p>
    </div>

    <!-- ── SUCCESS ────────────────────────────────────────────── -->
    <div class="card panel" id="successState" role="status" aria-live="polite" hidden>
      <span class="mark ok"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.78 4.22a.75.75 0 0 1 0 1.06l-6.5 6.5a.75.75 0 0 1-1.06 0l-3-3a.75.75 0 1 1 1.06-1.06L6.75 10.19l5.97-5.97a.75.75 0 0 1 1.06 0Z"/></svg></span>
      <p class="panel-title">Payment successful</p>
      <p class="panel-amount mono" id="successAmount"></p>
      <dl class="meta">
        <div><dt>Reference</dt><dd class="mono" id="successRef"></dd></div>
      </dl>
      <div class="panel-actions">
        <button type="button" class="btn" id="copyRefBtn">Copy reference</button>
        <button type="button" class="btn btn-quiet" id="doneBtn">Done</button>
      </div>
    </div>

    <!-- ── FAILED ─────────────────────────────────────────────── -->
    <div class="card panel" id="failedState" role="alert" aria-live="assertive" hidden>
      <span class="mark bad"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.75.75 0 1 1 1.06 1.06L9.06 8l3.22 3.22a.75.75 0 1 1-1.06 1.06L8 9.06l-3.22 3.22a.75.75 0 0 1-1.06-1.06L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z"/></svg></span>
      <p class="panel-title" id="failedTitle">Payment failed</p>
      <p class="panel-text" id="failedText"></p>
      <div class="panel-actions">
        <button type="button" class="btn btn-primary" id="retryBtn">Try again</button>
      </div>
    </div>

  </main>

  <noscript>
    <p class="pop">JavaScript is required to pay.</p>
  </noscript>

  <script src="js/app.js"></script>
</body>
</html>
